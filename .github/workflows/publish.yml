name: Publish

# Verify on every push and PR; publish only on a release a maintainer cuts.
#
# Publishing runs in CI rather than from a laptop on purpose: provenance is
# generated from GitHub's OIDC identity, so only a CI run can produce a real
# attestation. n8n has required provenance for community nodes since 2026-05-01,
# and provenance cannot be produced from a private repository, which is why this
# package lives in its own public repo instead of the monorepo.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # --ignore-scripts skips dependency BUILD scripts, not ours. n8n-workflow pulls
      # @n8n/expression-runtime -> isolated-vm, a native module that fails to compile
      # on the runner's Node 20 (it only installed locally because Node 22 had a
      # prebuilt binary). This package has zero runtime dependencies and never
      # executes n8n's expression VM, so compiling it is pure cost and a CI failure
      # we would be chasing forever. `npm publish` still runs prepublishOnly
      # (build + lint), so the publish path keeps its own gate.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run lint
      - run: npm test

  publish:
    # Only on a published release, and only after verify is green.
    needs: verify
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The entire publish credential. npm matches this OIDC token against the
      # package's trusted-publisher config; without it, publishing fails.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      # Node 20 bundles npm 10, and OIDC trusted publishing needs npm >= 11.5.1.
      # Without this the publish step sends no credential at all and the registry
      # answers `404 Not Found - PUT`, which reads like a missing package rather
      # than an auth failure. That is exactly how 1.0.3 failed.
      - run: npm install -g npm@latest
      - run: npm -v
      # --ignore-scripts skips dependency BUILD scripts, not ours. n8n-workflow pulls
      # @n8n/expression-runtime -> isolated-vm, a native module that fails to compile
      # on the runner's Node 20 (it only installed locally because Node 22 had a
      # prebuilt binary). This package has zero runtime dependencies and never
      # executes n8n's expression VM, so compiling it is pure cost and a CI failure
      # we would be chasing forever. `npm publish` still runs prepublishOnly
      # (build + lint), so the publish path keeps its own gate.
      - run: npm ci --ignore-scripts
      - run: npm run build
      # No NODE_AUTH_TOKEN and no --provenance flag on purpose. This package has a
      # trusted publisher configured on npm (GitHub Actions -> Saturation-IO/
      # n8n-nodes-saturation, publish.yml), so the `id-token: write` permission
      # above is the whole credential: npm verifies this workflow's OIDC identity
      # and generates the provenance attestation itself.
      #
      # Keeping a token here would mean the release pipeline still depended on a
      # secret that expires, and on one person's npm account. It does not.
      - run: npm publish --access public
