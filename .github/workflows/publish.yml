name: Publish

# Verify on every push and PR; publish only on a release a maintainer cuts.
#
# Publishing runs in CI rather than from a laptop on purpose: npm provenance is
# generated from GitHub's OIDC token, so `npm publish --provenance` only produces
# a real attestation here. n8n has required provenance for community nodes since
# 2026-05-01, and provenance cannot be produced from a private repository, which
# is why this package lives in its own public repo instead of the monorepo.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # --ignore-scripts skips dependency BUILD scripts, not ours. n8n-workflow pulls
      # @n8n/expression-runtime -> isolated-vm, a native module that fails to compile
      # on the runner's Node 20 (it only installed locally because Node 22 had a
      # prebuilt binary). This package has zero runtime dependencies and never
      # executes n8n's expression VM, so compiling it is pure cost and a CI failure
      # we would be chasing forever. `npm publish` still runs prepublishOnly
      # (build + lint), so the publish path keeps its own gate.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run lint
      - run: npm test

  publish:
    # Only on a published release, and only after verify is green.
    needs: verify
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance via OIDC. Without it `--provenance` fails.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      # --ignore-scripts skips dependency BUILD scripts, not ours. n8n-workflow pulls
      # @n8n/expression-runtime -> isolated-vm, a native module that fails to compile
      # on the runner's Node 20 (it only installed locally because Node 22 had a
      # prebuilt binary). This package has zero runtime dependencies and never
      # executes n8n's expression VM, so compiling it is pure cost and a CI failure
      # we would be chasing forever. `npm publish` still runs prepublishOnly
      # (build + lint), so the publish path keeps its own gate.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
